<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#718096;
    --line:#e5e9f2; --primary:#5b67f1; --primary2:#eef0ff;
    --success:#20a464; --danger:#e05252; --shadow:0 8px 30px rgba(28,38,64,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app{display:flex;min-height:100vh}
  aside{width:245px;background:#111827;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}
  .logo{font-size:21px;font-weight:800;padding:0 12px 26px}
  .logo span{color:#8f98ff}
  nav button{display:block;width:100%;border:0;background:transparent;color:#c8cfdd;text-align:left;padding:12px 13px;border-radius:10px;margin:4px 0}
  nav button.active,nav button:hover{background:#232b3c;color:#fff}
  main{flex:1;padding:28px;max-width:1500px;margin:auto;width:100%}
  .topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}
  h1{font-size:29px;margin:0 0 4px}
  h2{margin:0 0 15px;font-size:20px}
  .subtitle{color:var(--muted)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.danger{color:var(--danger)}
  .grid{display:grid;gap:18px}
  .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}
  .metric{font-size:28px;font-weight:800;margin-top:5px}
  .label{color:var(--muted);font-size:13px}
  .section{margin-top:20px}
  .week-card{overflow:auto}
  .week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .week-title{font-weight:750}
  .week-grid{min-width:980px;display:grid;grid-template-columns:240px repeat(7,1fr) 90px;gap:5px}
  .day-head,.habit-name,.pct,.cell{min-height:48px;display:flex;align-items:center;justify-content:center}
  .day-head{font-size:12px;color:var(--muted);flex-direction:column}
  .habit-name{justify-content:flex-start;padding:0 12px;font-weight:650}
  .habit-meta{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
  .cell{border:1px solid var(--line);border-radius:9px;background:#fafbfe;font-size:20px;transition:.12s}
  .cell:hover{transform:translateY(-1px);border-color:#c7cdfc}
  .cell.done{color:#fff;border-color:transparent}
  .pct{font-weight:750;font-size:13px}
  .progress{height:7px;background:#edf0f6;border-radius:99px;overflow:hidden;margin-top:7px}
  .progress>div{height:100%;background:var(--primary);border-radius:99px}
  .month-controls{display:flex;gap:9px;align-items:center;margin-bottom:18px}
  .month-controls input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}
  .month-block{margin-bottom:20px}
  .habit-month-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .habit-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:7px}
  .month-grid{overflow:auto}
  .calendar{min-width:900px;display:grid;grid-template-columns:230px repeat(31,34px);gap:3px}
  .calendar .head{height:34px;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .calendar .day{height:34px;border-radius:7px;background:#f0f2f7;border:1px solid #e5e8ef}
  .calendar .day.done{border-color:transparent}
  .calendar .habitlabel{display:flex;align-items:center;font-size:13px;padding-left:9px;font-weight:650}
  .table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:13px;overflow:hidden}
  th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:12px;color:var(--muted);background:#fafbfe}
  td input,td select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:#fff}
  .swatch{width:22px;height:22px;border-radius:6px;display:inline-block;border:1px solid #ddd}
  .chart-grid{grid-template-columns:1fr 1fr}
  .chart{height:270px;display:flex;align-items:flex-end;gap:12px;padding:15px 10px 5px}
  .barwrap{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;position:relative}
  .bar{width:min(34px,70%);border-radius:7px 7px 2px 2px;background:var(--primary);min-height:3px}
  .barvalue{position:absolute;bottom:calc(var(--h) + 7px);font-size:11px;color:var(--muted)}
  .barlabel{position:absolute;bottom:-22px;font-size:10px;color:var(--muted)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .hidden{display:none!important}
  .empty{padding:35px;text-align:center;color:var(--muted)}

  /* ===== Automatic dark mode ===== */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg:#0b1020;
      --card:#151b2d;
      --text:#e8edf5;
      --muted:#9aa6bb;
      --line:#293247;
      --primary:#7c86ff;
      --primary2:#252b4a;
      --success:#35c17a;
      --danger:#ff7070;
      --shadow:0 8px 30px rgba(0,0,0,.28);
    }

    body { background:var(--bg); color:var(--text); }
    .btn { background:var(--card); color:var(--text); }
    .btn.primary { background:var(--primary); color:#fff; }
    .card, table { background:var(--card); }
    th { background:#1b2235; }
    .cell { background:#171e30; border-color:var(--line); }
    .cell:hover { border-color:#5964b8; }
    .progress { background:#252c3d; }
    .month-controls input,
    td input,
    td select { background:#111827; color:var(--text); border-color:var(--line); }
    .calendar .day { background:#1b2233; border-color:var(--line); }
    .calendar .day.done { border-color:transparent; }
    .swatch { border-color:#475067; }
    .toast { background:#f1f5f9; color:#111827; }
  }
  .toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s}
  .toast.show{opacity:1;transform:none}
  @media(max-width:950px){
    aside{width:72px;padding:18px 9px}.logo{font-size:0;padding:0 8px 20px}.logo:after{content:"✓";font-size:25px}
    nav button{font-size:0;text-align:center}nav button:before{font-size:20px}
    nav button:nth-child(1):before{content:"✓"}nav button:nth-child(2):before{content:"▦"}nav button:nth-child(3):before{content:"◉"}nav button:nth-child(4):before{content:"⚙"}
    main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.chart-grid{grid-template-columns:1fr}
  }
  @media(max-width:580px){.cards{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}.topbar .actions{display:none}h1{font-size:24px}}

/* ===== iPhone / touch optimization ===== */
html { -webkit-text-size-adjust: 100%; }
body {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select {
  -webkit-appearance: none;
  appearance: none;
}
button {
  min-height: 44px;
  touch-action: manipulation;
}
input, select {
  min-height: 44px;
  font-size: 16px; /* prevents iOS Safari zoom on focus */
}
.cell {
  min-width: 44px;
  min-height: 52px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.btn {
  min-height: 44px;
  padding: 10px 14px;
}
.toast {
  bottom: calc(18px + env(safe-area-inset-bottom));
}

@media (max-width: 700px) {
  :root { --shadow: 0 4px 18px rgba(28,38,64,.07); }

  body {
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }

  .app {
    display: block;
    min-height: 100dvh;
  }

  /* Bottom navigation is much easier to use with one hand on iPhone. */
  aside {
    position: fixed;
    z-index: 1000;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    width: 100%;
    height: auto;
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
    background: rgba(17,24,39,.97);
    border-top: 1px solid rgba(255,255,255,.08);
  }

  .logo { display: none; }

  nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }

  nav button,
  nav button.active,
  nav button:hover {
    margin: 0;
    min-height: 58px;
    padding: 7px 3px;
    border-radius: 11px;
    color: #c8cfdd;
    background: transparent;
    font-size: 10px;
    line-height: 1.15;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }

  nav button.active {
    background: #232b3c;
    color: #fff;
  }

  nav button:before {
    display: block;
    font-size: 20px;
    line-height: 20px;
  }
  nav button:nth-child(1):before { content: "✓"; }
  nav button:nth-child(2):before { content: "▦"; }
  nav button:nth-child(3):before { content: "◉"; }
  nav button:nth-child(4):before { content: "⚙"; }

  main {
    padding: max(14px, env(safe-area-inset-top)) 12px 12px;
    max-width: none;
  }

  .topbar {
    gap: 10px;
    margin-bottom: 14px;
    align-items: flex-start;
  }

  h1 { font-size: 23px; line-height: 1.15; }
  .subtitle { font-size: 13px; line-height: 1.35; }

  .topbar .actions { display: none; }

  .cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .card {
    border-radius: 13px;
    padding: 13px;
  }

  .metric {
    font-size: 22px;
    line-height: 1.15;
    overflow-wrap: anywhere;
  }

  .label { font-size: 11px; }

  .section { margin-top: 12px; }

  .week-card { padding: 12px 10px; }
  .week-head {
    margin-bottom: 10px;
    gap: 8px;
  }
  .week-head h2, h2 { font-size: 17px; }

  .week-head .actions {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }

  .week-head .actions .btn {
    min-width: 44px;
    padding: 8px 10px;
  }

  /* Keep the weekly grid usable: swipe horizontally instead of shrinking cells. */
  .week-card {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .week-card::-webkit-scrollbar { display: none; }

  .week-grid {
    min-width: 600px;
    grid-template-columns: 145px repeat(7, minmax(48px, 1fr)) 58px;
    gap: 4px;
  }

  .day-head, .habit-name, .pct, .cell { min-height: 50px; }
  .day-head { font-size: 10px; }
  .habit-name {
    padding: 0 7px;
    font-size: 12px;
  }
  .habit-meta { font-size: 10px; }
  .cell { font-size: 20px; border-radius: 9px; }

  .month-controls {
    margin-bottom: 12px;
  }

  .month-controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    font-size: 13px;
  }

  .month-controls input {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    padding: 9px 10px;
  }

  .month-block { margin-bottom: 12px; }
  .habit-month-title h2 {
    margin-bottom: 0;
    font-size: 16px;
  }

  .month-grid {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .month-grid::-webkit-scrollbar { display: none; }

  .calendar {
    min-width: 770px;
    grid-template-columns: 125px repeat(31, 30px);
    gap: 3px;
  }

  .calendar .head, .calendar .day { height: 30px; }
  .calendar .habitlabel { font-size: 11px; padding-left: 6px; }

  .chart-grid { grid-template-columns: 1fr; gap: 10px; }
  .chart { height: 220px; gap: 5px; padding: 10px 4px 4px; }
  .bar { width: min(30px, 72%); }
  .barlabel { font-size: 9px; }

  /* Settings becomes stacked cards instead of a cramped table. */
  .table-wrap { overflow: visible; }
  table, thead, tbody, tr, td { display: block; width: 100%; }
  table { background: transparent; }
  thead { display: none; }
  tbody { display: grid; gap: 10px; }

  tbody tr {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 10px;
    box-shadow: var(--shadow);
  }

  tbody td {
    border: 0;
    padding: 4px 0;
  }

  tbody td:nth-child(1):before { content: "Gewohnheit"; }
  tbody td:nth-child(2):before { content: "Kategorie"; }
  tbody td:nth-child(3):before { content: "Aktiv"; }
  tbody td:nth-child(4):before { content: "Farbe"; }

  tbody td:not(:last-child):before {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 3px;
  }

  tbody td:last-child {
    padding-top: 7px;
  }

  tbody td input,
  tbody td select {
    width: 100%;
    min-height: 44px;
    font-size: 16px;
  }

  tbody td input[type="color"] {
    width: 60px;
    padding: 3px;
  }

  tbody td:last-child .btn {
    width: 100%;
  }

  #settingsView .week-head {
    align-items: center;
  }

  #settingsView .week-head .btn {
    white-space: nowrap;
  }

  .empty { padding: 25px 12px; }

  .toast {
    left: 12px;
    right: 12px;
    bottom: calc(78px + env(safe-area-inset-bottom));
    text-align: center;
  }
}

/* Very small iPhones */
@media (max-width: 390px) {
  main { padding-left: 9px; padding-right: 9px; }
  .cards { gap: 7px; }
  .card { padding: 11px; }
  .metric { font-size: 20px; }
  .week-grid { min-width: 570px; grid-template-columns: 135px repeat(7, 46px) 55px; }
}

/* Respect reduced-motion preferences. */
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}

</style>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HabitFlow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

</head>
<body>
<div class="app">
  <aside>
    <div class="logo">Habit<span>Flow</span></div>
    <nav>
      <button class="active" data-view="tracker">Tracker</button>
      <button data-view="month">Monatsübersicht</button>
      <button data-view="stats">Auswertung</button>
      <button data-view="settings">Gewohnheiten</button>
    </nav>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="title">Habit Tracker</h1>
        <div class="subtitle" id="subtitle">Deine Woche auf einen Blick</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="exportData()">Daten exportieren</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">Daten importieren</button>
        <input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0]); this.value='';">
        <button class="btn" onclick="resetData()">Zurücksetzen</button>
      </div>
    </div>

    <section id="trackerView">
      <div class="grid cards" id="metrics"></div>
      <div class="section">
        <div class="card week-card">
          <div class="week-head">
            <h2>Wochen-Tracker</h2>
            <div class="actions">
              <button class="btn" onclick="shiftWeek(-1)">←</button>
              <button class="btn" onclick="goToday()">Heute</button>
              <button class="btn" onclick="shiftWeek(1)">→</button>
            </div>
          </div>
          <div id="weekTracker"></div>
        </div>
      </div>
    </section>

    <section id="monthView" class="hidden">
      <div class="month-controls">
        <label>Monat <input type="month" id="monthPicker"></label>
      </div>
      <div id="monthOverview"></div>
    </section>

    <section id="statsView" class="hidden">
      <div class="grid cards" id="statMetrics"></div>
      <div class="grid chart-grid section">
        <div class="card"><h2>Erfüllung pro Gewohnheit</h2><div id="habitChart" class="chart"></div></div>
        <div class="card"><h2>Entwicklung pro Woche</h2><div id="weekChart" class="chart"></div></div>
      </div>
      <div class="card section"><h2>Nach Kategorien</h2><div id="categoryStats"></div></div>
    </section>

    <section id="settingsView" class="hidden">
      <div class="card">
        <div class="week-head">
          <h2>Gewohnheiten verwalten</h2>
          <button class="btn primary" onclick="addHabit()">+ Gewohnheit</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Gewohnheit</th><th>Kategorie</th><th>Aktiv</th><th>Farbe</th><th></th></tr></thead>
            <tbody id="habitTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
const COLORS = ["#5b67f1","#20a464","#e58a22","#d9548b","#00a1a7","#8b5cf6","#d94f4f","#6b7280","#159957","#b35c00"];
const defaultHabits = [
  ["Wasser trinken","Gesundheit",true,COLORS[0]],
  ["Sport / Bewegung","Gesundheit",true,COLORS[1]],
  ["Lesen","Persönlich",true,COLORS[2]],
  ["Meditation","Mental",true,COLORS[3]],
  ["Früh schlafen","Schlaf",true,COLORS[4]],
  ["Vitamins / Supplements","Gesundheit",true,COLORS[5]]
];

let habits = JSON.parse(localStorage.getItem("habitflow_habits") || "null") || defaultHabits.map((h,i)=>({id:"h"+i,name:h[0],cat:h[1],active:h[2],color:h[3]}));
if (!habits[0]?.id) habits = habits.map((h,i)=>({id:"h"+i,name:h[0],cat:h[1],active:h[2],color:h[3]}));
let entries = JSON.parse(localStorage.getItem("habitflow_entries") || "{}");
let weekStart = monday(new Date());
let selectedMonth = new Date().toISOString().slice(0,7);

function monday(d){const x=new Date(d); const day=x.getDay()||7; x.setDate(x.getDate()-day+1); x.setHours(0,0,0,0); return x;}
function iso(d){return new Date(d).toISOString().slice(0,10)}
function fmt(d){return new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit"}).format(d)}
function save(){localStorage.setItem("habitflow_habits",JSON.stringify(habits));localStorage.setItem("habitflow_entries",JSON.stringify(entries));}
function activeHabits(){return habits.filter(h=>h.active)}
function isDone(id,date){return !!entries[iso(date)+"_"+id]}
function toggle(id,date){
  const key=iso(date)+"_"+id;
  if(entries[key]) delete entries[key]; else entries[key]=true;
  save(); render();
}


function pctFor(id,from,to){
  let total=0, done=0;
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){total++;if(isDone(id,d))done++}
  return total?Math.round(done/total*100):0;
}
function overall(from,to){
  const hs=activeHabits(); if(!hs.length)return 0;
  return Math.round(hs.reduce((s,h)=>s+pctFor(h.id,from,to),0)/hs.length);
}
function render(){
  renderMetrics();renderWeek();renderMonth();renderStats();renderHabits();
}
function renderMetrics(){
  const end=new Date(weekStart);end.setDate(end.getDate()+6);
  const hs=activeHabits(), avg=overall(weekStart,end);
  const today=new Date(), todayDone=hs.filter(h=>isDone(h.id,today)).length;
  document.getElementById("metrics").innerHTML=[
    ["Wochenziel",avg+"%","Durchschnitt aller Gewohnheiten"],
    ["Heute",todayDone+"/"+hs.length,"Gewohnheiten erledigt"],
    ["Beste Gewohnheit",bestHabit(weekStart,end)?.name||"–",bestHabit(weekStart,end)?pctFor(bestHabit(weekStart,end).id,weekStart,end)+"%":"–"],
    ["Aktive Gewohnheiten",hs.length,"individuell anpassbar"]
  ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div><div class="label">${x[2]}</div></div>`).join("");
}
function bestHabit(a,b){return activeHabits().sort((x,y)=>pctFor(y.id,a,b)-pctFor(x.id,a,b))[0]}
function renderWeek(){
  const names=["Mo","Di","Mi","Do","Fr","Sa","So"];
  const days=Array.from({length:7},(_,i)=>{let d=new Date(weekStart);d.setDate(d.getDate()+i);return d});
  let html=`<div class="week-grid"><div></div>${days.map((d,i)=>`<div class="day-head"><b>${names[i]}</b><span>${fmt(d)}</span></div>`).join("")}<div class="day-head">Woche</div>`;
  for(const h of activeHabits()){
    html+=`<div class="habit-name"><div><div><span class="habit-dot" style="background:${h.color}"></span>${esc(h.name)}</div><div class="habit-meta">${esc(h.cat)}</div></div></div>`;
    days.forEach(d=>{const done=isDone(h.id,d);html+=`<button type="button" class="cell ${done?"done":""}" data-habit="${attr(h.id)}" data-date="${iso(d)}" style="${done?"background:"+h.color:""}" aria-label="${esc(h.name)} – ${iso(d)}" title="${iso(d)}" onclick="toggle('${h.id}','${iso(d)}')">${done?"✓":""}</button>`});
    html+=`<div class="pct">${pctFor(h.id,weekStart,days[6])}%</div>`;
  }
  html+=`</div>`;
  document.getElementById("weekTracker").innerHTML=activeHabits().length?html:`<div class="empty">Noch keine aktiven Gewohnheiten.</div>`;
}
function shiftWeek(n){weekStart.setDate(weekStart.getDate()+n*7);render()}
function goToday(){weekStart=monday(new Date());render()}
function renderMonth(){
  const p=document.getElementById("monthPicker");p.value=selectedMonth;p.onchange=()=>{selectedMonth=p.value;renderMonth()};
  const [y,m]=selectedMonth.split("-").map(Number);const days=new Date(y,m,0).getDate();
  document.getElementById("monthOverview").innerHTML=activeHabits().map(h=>{
    let done=0;for(let d=1;d<=days;d++){if(isDone(h.id,new Date(y,m-1,d)))done++}
    return `<div class="card month-block"><div class="habit-month-title"><h2><span class="habit-dot" style="background:${h.color}"></span>${esc(h.name)}</h2><b>${Math.round(done/days*100)}%</b></div>
      <div class="month-grid"><div class="calendar">${Array.from({length:31},(_,i)=>i<days?`<div class="head">${i+1}</div>`:`<div></div>`).join("")}
      <div class="habitlabel">${esc(h.cat)}</div>${Array.from({length:days},(_,i)=>{const done=isDone(h.id,new Date(y,m-1,i+1));return `<div class="day ${done?"done":""}" style="${done?"background:"+h.color:""}" title="${i+1}.${m}.${y}"></div>`}).join("")}</div></div></div>`;
  }).join("") || `<div class="card empty">Keine aktiven Gewohnheiten.</div>`;
}
function renderStats(){
  const now=new Date(), start=new Date(now.getFullYear(),now.getMonth(),1), end=new Date(now.getFullYear(),now.getMonth()+1,0);
  const hs=activeHabits(), avg=overall(start,end), total=Object.keys(entries).length;
  document.getElementById("statMetrics").innerHTML=[
    ["Monatsdurchschnitt",avg+"%","aktueller Monat"],
    ["Erledigte Einträge",total,"gespeicherte Check-ins"],
    ["Stärkste Kategorie",bestCategory()||"–","aktueller Monat"],
    ["Gewohnheiten",hs.length,"aktive Einträge"]
  ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div><div class="label">${x[2]}</div></div>`).join("");
  drawBars("habitChart",hs.map(h=>[h.name,pctFor(h.id,start,end),h.color]));
  const weeks=[];let ws=monday(new Date(now.getFullYear(),now.getMonth(),1));
  for(let i=0;i<5;i++){let we=new Date(ws);we.setDate(we.getDate()+6);weeks.push([`KW ${weekNum(ws)}`,overall(ws,we),null]);ws.setDate(ws.getDate()+7)}
  drawBars("weekChart",weeks);
  const cats={};hs.forEach(h=>{cats[h.cat]??=[];cats[h.cat].push(h)});
  document.getElementById("categoryStats").innerHTML=Object.entries(cats).map(([cat,list])=>{
    const v=Math.round(list.reduce((s,h)=>s+pctFor(h.id,start,end),0)/list.length);
    return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>${esc(cat)}</b><span>${v}%</span></div><div class="progress"><div style="width:${v}%"></div></div></div>`
  }).join("")||`<div class="empty">Keine Daten.</div>`;
}
function bestCategory(){
  const now=new Date(),s=new Date(now.getFullYear(),now.getMonth(),1),e=new Date(now.getFullYear(),now.getMonth()+1,0),cats={};
  activeHabits().forEach(h=>(cats[h.cat]??=[]).push(h));
  const arr=Object.entries(cats).map(([c,hs])=>[c,hs.reduce((a,h)=>a+pctFor(h.id,s,e),0)/hs.length]);
  return arr.sort((a,b)=>b[1]-a[1])[0]?.[0];
}
function weekNum(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+4-(x.getDay()||7));const y=new Date(x.getFullYear(),0,1);return Math.ceil((((x-y)/86400000)+1)/7)}
function drawBars(id,data){
  const el=document.getElementById(id);
  el.innerHTML=data.map(([label,v,color])=>`<div class="barwrap" style="--h:${Math.max(3,v*2.25)}px"><div class="barvalue">${v}%</div><div class="bar" style="height:${Math.max(3,v*2.25)}px;${color?"background:"+color:""}"></div><div class="barlabel">${esc(String(label).slice(0,11))}</div></div>`).join("");
}
function renderHabits(){
  document.getElementById("habitTable").innerHTML=habits.map((h,i)=>`<tr>
    <td><input value="${attr(h.name)}" onchange="editHabit(${i},'name',this.value)"></td>
    <td><input value="${attr(h.cat)}" onchange="editHabit(${i},'cat',this.value)"></td>
    <td><select onchange="editHabit(${i},'active',this.value==='true')"><option value="true" ${h.active?"selected":""}>Ja</option><option value="false" ${!h.active?"selected":""}>Nein</option></select></td>
    <td><input type="color" value="${h.color}" onchange="editHabit(${i},'color',this.value)"></td>
    <td><button class="btn danger" onclick="removeHabit(${i})">Löschen</button></td>
  </tr>`).join("");
}
function editHabit(i,k,v){habits[i][k]=v;save();render()}
function addHabit(){habits.push({id:"h"+Date.now(),name:"Neue Gewohnheit",cat:"Allgemein",active:true,color:COLORS[habits.length%COLORS.length]});save();render()}
function removeHabit(i){if(confirm("Gewohnheit wirklich löschen?")){habits.splice(i,1);save();render()}}
function exportData(){
  const backup={version:1,exportedAt:new Date().toISOString(),habits,entries};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="habitflow-backup.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Backup exportiert");
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data || !Array.isArray(data.habits) || !data.entries || typeof data.entries!=="object" || Array.isArray(data.entries)) throw new Error("Ungültiges Backup");
      const importedHabits=data.habits.map((h,i)=>({
        id:String(h.id||("h"+Date.now()+"_"+i)),
        name:String(h.name??"Neue Gewohnheit"),
        cat:String(h.cat??"Allgemein"),
        active:h.active!==false,
        color:/^#[0-9a-fA-F]{6}$/.test(String(h.color||""))?String(h.color):COLORS[i%COLORS.length]
      }));
      const importedEntries={};
      Object.entries(data.entries).forEach(([key,value])=>{if(value) importedEntries[String(key)]=true;});
      if(!confirm("Das aktuelle HabitFlow-Set wird durch das Backup ersetzt. Fortfahren?"))return;
      habits=importedHabits;
      entries=importedEntries;
      save();
      weekStart=monday(new Date());
      render();
      toast("Backup importiert");
    }catch(e){
      alert("Dieses Backup konnte nicht importiert werden. Bitte wähle eine gültige HabitFlow-Backup-Datei aus.");
    }
  };
  reader.onerror=()=>alert("Die Datei konnte nicht gelesen werden.");
  reader.readAsText(file);
}
function resetData(){if(confirm("Alle Check-ins und Gewohnheiten auf den Startzustand zurücksetzen?")){localStorage.clear();location.reload()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function attr(s){return esc(s)}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  ["tracker","month","stats","settings"].forEach(v=>document.getElementById(v+"View").classList.toggle("hidden",v!==b.dataset.view));
  const titles={tracker:["Habit Tracker","Deine Woche auf einen Blick"],month:["Monatsübersicht","Jede Gewohnheit separat und farblich markiert"],stats:["Auswertung","Fortschritt, Kategorien und Trends"],settings:["Gewohnheiten","Namen, Kategorien, Farben und Aktivität anpassen"]};
  document.getElementById("title").textContent=titles[b.dataset.view][0];document.getElementById("subtitle").textContent=titles[b.dataset.view][1];
  render();
});
render();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
